<!doctype html>
<html lang="zh-Hant-TW" data-theme="light" data-scale="large">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的理財帳本</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // 畫面程式的錯誤：留給自動測試檢查，並寫進資料夾的「錯誤紀錄.log」
    window.__errors = [];
    const report = (t) => { window.__errors.push(t); try { window.pywebview.api.log_js_error(t); } catch (_) {} };
    window.addEventListener("error", (e) => report(String(e.message) + " @ " + e.filename + ":" + e.lineno));
    window.addEventListener("unhandledrejection", (e) => {
      const r = e.reason;
      if (r && r.user) return;      // 帳務規則的提示（例如「此期間已結帳」）已經顯示給使用者，不是程式錯誤
      report("promise: " + String(r && (r.stack || r)));
    });
  </script>
  <script type="importmap">
    {"imports": {"preact": "./vendor/preact.module.js", "preact/hooks": "./vendor/hooks.module.js",
                 "htm": "./vendor/htm.module.js"}}
  </script>
  <script src="vendor/echarts.min.js"></script>
</head>
<body>
  <div id="app"><div class="boot">正在開啟帳本…</div></div>
  <script type="module" src="app.js"></script>
</body>
</html>
